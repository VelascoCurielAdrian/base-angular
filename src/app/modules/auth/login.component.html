<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="card-header">
        <img src="/logo.svg" alt="Grupo Coppel" class="logo" />
        <h1 class="title">Mesa de Servicios Financieros</h1>
        <p class="subtitle">Portal Administrativo</p>
      </div>

      <div class="card-body">
        <p class="description">
          Autenticación mediante credenciales de dominio corporativo
        </p>

        <button type="button" class="login-btn" (click)="login()">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span>Iniciar Sesión con Dominio</span>
        </button>
      </div>

      <div class="card-footer">
        <div class="license-info">
          <span class="license-text">Licenciado por</span>
          <span class="license-company">AFORE COPPEL</span>
        </div>
        <span class="access-notice">Acceso restringido a personal autorizado</span>
      </div>
    </div>
  </div>
</div>
