<!-- eslint-disable @angular-eslint/template/no-call-expression -->
<header class="appbar" [class.appbar--mobile]="isMobile()" [class.appbar--tablet]="isTablet()" [class.appbar--small]="isSmallScreen()">
  <div class="appbar__left">
    <button
      type="button"
      class="appbar__menu-button"
      (click)="onMenuClick()"
      title="Menú"
      [attr.aria-expanded]="isSidebarCollapsed()"
      aria-label="Toggle menu"
    >
      <lucide-angular [img]="MenuIcon" [size]="isMobile() ? 20 : 24" />
    </button>
  </div>

  <div class="appbar__center">
    <div class="appbar__search-container"
         [class.appbar__search-container--mobile]="isMobile()"
         [class.appbar__search-container--active]="isSearchActive()">
      <lucide-angular
        class="appbar__search-icon"
        [img]="SearchIcon"
        [size]="isMobile() ? 16 : 18" />

      <input
        #searchInput
        type="text"
        class="appbar__search-input"
        [placeholder]="searchPlaceholder()"
        [value]="searchValue()"
        (click)="onSearchClick()"
        (input)="onSearchInput($event)"
        (keydown)="onSearchKeydown($event)"
        (focus)="isSearchFocused.set(true)"
        (blur)="isSearchFocused.set(false)"
        autocomplete="off"
        spellcheck="false"
      />

      @if (isSearchActive()) {
        <button
          type="button"
          class="appbar__search-clear"
          (click)="clearSearch()"
          title="Limpiar búsqueda"
          aria-label="Clear search">
          <span>×</span>
        </button>
      } @else if (!isMobile() && !isSmallScreen()) {
        <kbd class="appbar__shortcut">⌘K</kbd>
      }
    </div>
  </div>

  <div class="appbar__right">

    <button
      type="button"
      class="appbar__icon-button"
      (click)="toggleNotifications.emit()"
      title="Notificaciones"
      aria-label="Notificaciones"
    >
      <lucide-angular [img]="BellIcon" [size]="isMobile() ? 18 : 20" />
      @if (unreadNotifications() > 0) {
        <span class="appbar__notification-badge">{{ unreadNotifications() }}</span>
      }
    </button>

    @if (user()) {
      <div class="appbar__user-menu">
        <button
          type="button"
          class="appbar__user-button"
          [class.appbar__user-button--mobile]="isMobile()"
          (click)="toggleUserMenu()"
          [class.appbar__user-button--active]="isUserMenuOpen()"
          title="Menú de usuario"
          aria-label="User menu"
          [attr.aria-expanded]="isUserMenuOpen()"
        >
          <div class="appbar__avatar" [class.appbar__avatar--mobile]="isMobile()">
            @if (user()?.avatar_url) {
              <img [src]="user()?.avatar_url" [alt]="userName()" class="appbar__avatar-img" />
            } @else {
              <span class="appbar__avatar-initials">{{ userInitials() }}</span>
            }
          </div>
          @if (!isMobile()) {
            <span class="appbar__user-name">{{ userName() }}</span>
            <lucide-angular
              [img]="ChevronDownIcon"
              [size]="16"
              class="appbar__chevron"
              [class.appbar__chevron--rotated]="isUserMenuOpen()"
            />
          }
        </button>

        @if (isUserMenuOpen()) {
          <div
            class="appbar__user-dropdown"
            (click)="$event.stopPropagation()"
            (keyup.enter)="$event.stopPropagation()"
            tabindex="0"
            role="menu"
          >
            <div class="appbar__user-info">
              <div class="appbar__avatar appbar__avatar--large">
                @if (user()?.avatar_url) {
                  <img [src]="user()?.avatar_url" [alt]="userName()" class="appbar__avatar-img" />
                } @else {
                  <span class="appbar__avatar-initials">{{ userInitials() }}</span>
                }
              </div>
              <div class="appbar__user-details">
                <p class="appbar__user-details-name">{{ userName() }}</p>
                <p class="appbar__user-details-email">{{ user()?.email }}</p>
              </div>
            </div>

            <div class="appbar__menu-divider"></div>

            <div class="appbar__menu-items">
              <button type="button" class="appbar__menu-item" (click)="goToProfile()">
                <lucide-angular [img]="UserIcon" [size]="16" />
                <span>Mi Perfil</span>
              </button>

              <button type="button" class="appbar__menu-item" (click)="goToSettings()">
                <lucide-angular [img]="SettingsIcon" [size]="16" />
                <span>Configuración</span>
              </button>

              <button type="button" class="appbar__menu-item" (click)="changeTheme()">
                @if (isDarkTheme()) {
                  <lucide-angular [img]="SunIcon" [size]="16" />
                  <span>Cambiar a Claro</span>
                } @else {
                  <lucide-angular [img]="MoonIcon" [size]="16" />
                  <span>Cambiar a Oscuro</span>
                }
              </button>

              <div class="appbar__menu-divider"></div>

              <button type="button" class="appbar__menu-item appbar__menu-item--danger" (click)="logout()">
                <lucide-angular [img]="LogOutIcon" [size]="16" />
                <span>Cerrar Sesión</span>
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>
</header>

<!-- Modal de confirmación para cerrar sesión -->
<app-confirmation-modal
  [isVisible]="showLogoutModal()"
  [title]="'Confirmar salida'"
  [message]="'¿Estás absolutamente seguro de que deseas cerrar sesión? Perderás el acceso a tu cuenta hasta que vuelvas a iniciar sesión.'"
  [primaryActionText]="'Sí, cerrar sesión'"
  [secondaryActionText]="'Cancelar'"
  (confirm)="onConfirmLogout()"
  (cancelled)="onCancelLogout()">
</app-confirmation-modal>
